# The Prometheus of the Compose "observability" profile: it scrapes the API and every worker
# and evaluates alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    # Every replica of the worker service, found by Docker's DNS.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
