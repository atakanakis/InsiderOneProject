# One command: docker compose up --build
#
#   API            http://localhost:8080/healthz, http://localhost:8080/readyz
#   Mock provider  http://localhost:9090/stats
#   Workers        two (WORKER_REPLICAS); make enqueue adds rows, make status counts them
#
# Every setting of internal/config can be set in an optional .env file.

name: insider-notifications

x-app: &app
  image: insider-notifications:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &env
    DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    # Not published on the host, to avoid a clash with a local Postgres.
    # Inspect with: docker compose exec postgres psql -U notifications
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # Over TCP: during its first start Postgres answers on the Unix socket before it
      # accepts TCP connections, and migrate connects over TCP once.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notifications"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the migrations once and exits. Only this service builds the image, so the build
  # happens once; the others run the same image.
  migrate:
    <<: *app
    build: .
    command: ["/app/migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["/app/api"]
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["/app/worker"]
    # Two workers share the rate limit through Redis and the queue through Postgres.
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    # Architecture §13: the grace period must be longer than the worker's shutdown timeout
    # (25 s), so Docker does not kill a worker that still waits for sends in flight. The
    # container's grace period and the worker's STOP_GRACE_PERIOD come from one variable, and
    # the worker refuses to start when the relation does not hold
    # (TestComposeGivesTheWorkerItsStopGracePeriod).
    stop_grace_period: ${STOP_GRACE_PERIOD:-30s}
    environment:
      <<: *env
      PROVIDER_URL: ${PROVIDER_URL:-http://mockprovider:9090/send}
      STOP_GRACE_PERIOD: ${STOP_GRACE_PERIOD:-30s}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mockprovider: { condition: service_healthy }

  # The local stand-in for the external provider (cmd/mockprovider).
  mockprovider:
    <<: *app
    command: ["/app/mockprovider"]
    ports: ["9090:9090"]
    environment:
      MOCK_LATENCY: ${MOCK_LATENCY:-0s}
      MOCK_FAIL_RATE: ${MOCK_FAIL_RATE:-0}
      MOCK_THROTTLE_RATE: ${MOCK_THROTTLE_RATE:-0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
