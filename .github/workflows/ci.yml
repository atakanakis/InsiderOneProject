name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    # Unit and integration tests; testcontainers starts Postgres and Redis on the runner's
    # Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test (race detector)
        run: make test
      - name: Every test named in docs/ exists
        run: make check-docs

  guards:
    # Each guard is disabled in turn; its named test must fail (CLAUDE.md, rule 13).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Guards
        run: make guards
      - name: The tree is unchanged after the mutations
        run: git diff --exit-code

  compose:
    # The stack starts with one command, the API answers its health endpoints, and two
    # workers deliver.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up --build -d --wait api worker mockprovider
      - name: Health endpoints
        run: |
          curl -sf localhost:8080/healthz
          curl -sf localhost:8080/readyz
          curl -sf localhost:9090/stats
      - name: Two workers deliver, within the limit at the provider
        # No API until session 6: rows go straight into the database (make enqueue).
        run: |
          test "$(docker compose ps worker --format '{{.Name}}' | wc -l)" -eq 2
          make enqueue N=500
          for i in $(seq 1 60); do
            left=$(docker compose exec -T postgres psql -U notifications -tAc \
              "SELECT count(*) FROM notifications WHERE status <> 'sent'")
            [ "$left" = 0 ] && break
            sleep 1
          done
          make status
          curl -s localhost:9090/stats | tee stats.json
          test "$left" = 0
          python3 -c 'import json, sys; s = json.load(open("stats.json")); p = s["maxInAnyOneSecondWindow"]; sys.exit(0 if s["received"] == 1500 and max(p[c] for c in ("sms", "email", "push")) <= 100 else 1)'
      - name: The workers stop cleanly
        run: |
          docker compose stop worker
          test "$(docker compose ps -a worker --format '{{.ExitCode}}' | sort -u)" = 0
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
