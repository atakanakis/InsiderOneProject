name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: No build output is tracked
        # Two binaries of 23 MB each were committed once (session 7's review, F1).
        run: |
          found=$(git ls-files -z | xargs -0 file | grep -E 'executable|ELF|Mach-O' || true)
          if [ -n "$found" ]; then echo "$found"; exit 1; fi

  test:
    # Unit and integration tests; testcontainers starts Postgres and Redis on the runner's
    # Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test (race detector)
        run: make test
      - name: Every test named in docs/ exists
        run: make check-docs
      - name: I1, A4 and A5 through the dispatchers, and the fault test, without the race detector
        # The race detector slows the client and the recording server on the same CPUs
        # (architecture §12, A4); these measurements are of the program as it ships.
        run: A5_FULL=1 go test -count=1 -v -run 'TestTheProviderReceivesAtMostTheLimitThroughTheDispatchers|TestGateWaitAndThroughputWithManyDispatchers|TestInvariantsHoldUnderRandomFaults' ./internal/dispatch

  alerts:
    # Every alert rule has a promtool test in which it fires, and the tests pass
    # (architecture §10). Whether the rules name only what the binaries export is checked by
    # the test job (TestEveryAlertRuleUsesMetricsTheBinariesExport) and the compose job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: promtool check, promtool test, a firing test for every rule
        run: make alerts

  guards:
    # Each guard is disabled in turn; its named test must fail (CLAUDE.md, rule 13).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Guards
        run: make guards
      - name: The tree is unchanged after the mutations
        run: git diff --exit-code

  compose:
    # The stack starts with one command, the API answers its health endpoints, and
    # notifications sent through the API are delivered by two workers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start the stack
        run: docker compose up --build -d --wait api worker mockprovider
      - name: Health endpoints
        run: |
          curl -sf localhost:8080/healthz
          curl -sf localhost:8080/readyz
          curl -sf localhost:9090/stats
      - name: Two workers deliver what the API accepted, within the limit at the provider
        # tools/e2e: one notification followed over the WebSocket (scheduled, processing,
        # sent), one with an idempotency key and its repeat, then a batch of 500 per channel,
        # all through the API; it waits until every one is sent. The mock provider must have
        # received exactly those 1502, at most 100 per second per channel.
        run: |
          test "$(docker compose ps worker --format '{{.Name}}' | wc -l)" -eq 2
          go run ./tools/e2e -n 500 -timeout 120s
          make status
          curl -s localhost:9090/stats | tee stats.json
          python3 -c 'import json, sys; s = json.load(open("stats.json")); p = s["maxInAnyOneSecondWindow"]; sys.exit(0 if s["received"] == 1502 and max(p[c] for c in ("sms", "email", "push")) <= 100 else 1)'
      - name: The metrics agree with the provider, and every alert rule names what is exported
        # The sent attempts the two workers count add up to what the provider received; the
        # API's queue figures are exported; tools/alertcheck reads the three scrapes.
        run: |
          curl -sf localhost:8080/metrics > api.prom
          docker compose exec -T --index 1 worker wget -qO- http://localhost:9100/metrics > worker1.prom
          docker compose exec -T --index 2 worker wget -qO- http://localhost:9100/metrics > worker2.prom
          curl -sf localhost:8080/v1/metrics | tee v1metrics.json
          python3 - <<'PY'
          import json, sys
          sent = sum(float(l.split()[-1]) for f in ("worker1.prom", "worker2.prom") for l in open(f)
                     if l.startswith("notifications_attempts_total{") and 'outcome="sent"' in l)
          received = json.load(open("stats.json"))["received"]
          api = open("api.prom").read()
          figures = json.load(open("v1metrics.json"))["channels"]
          window = sum(c["attempts"]["byOutcome"]["sent"] for c in figures.values())
          print(f"sent attempts by the workers' counters {sent:.0f}, by /v1/metrics {window}, received by the provider {received}")
          ok = sent == received == window and 'notifications_queue_depth{channel="sms",status="pending"} 0' in api
          sys.exit(0 if ok else 1)
          PY
          go run ./tools/alertcheck api.prom worker1.prom worker2.prom
      - name: The workers stop cleanly
        run: |
          docker compose stop worker
          test "$(docker compose ps -a worker --format '{{.ExitCode}}' | sort -u)" = 0
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
